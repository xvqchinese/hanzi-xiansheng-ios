# 汉字先生 iOS 云端编译 workflow（GitHub Actions 免费 macOS runner）
# 用法：注册 GitHub → 建私有仓库 → 上传源码 → 配好 secrets → push 即自动编译签名出 ipa
# 需要的 secrets（仓库 Settings → Secrets and variables → Actions）：
#   CERT_P12_BASE64     = 开发者证书 .p12 文件 base64（旧 Mac 钥匙串导出，密码见下）
#   CERT_P12_PASSWORD   = .p12 导出时设置的密码
#   PROV_PROFILE_BASE64 = 主 App 的 provisioning profile base64
#   PROV_PROFILE_KEYBOARD_BASE64 = 键盘扩展的 provisioning profile base64
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_API_KEY_BASE64 = App Store Connect API Key（可选，用于自动上传）
name: build-ipa

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ReleaseTrigger.txt'

jobs:
  build:
    runs-on: macos-15   # 2026 年 runner，自带最新 Xcode
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 选择最新 Xcode
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: 安装签名证书
        env:
          P12_B64: ${{ secrets.CERT_P12_BASE64 }}
          P12_PW:  ${{ secrets.CERT_P12_PASSWORD }}
        run: |
          echo "$P12_B64" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci ci.keychain
          security default-keychain -s ci.keychain
          security unlock-keychain -p ci ci.keychain
          security import /tmp/cert.p12 -k ci.keychain -P "$P12_PW" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
          security list-keychains -d user -s ci.keychain

      - name: 安装 provisioning profiles
        env:
          PROV_MAIN:      ${{ secrets.PROV_PROFILE_BASE64 }}
          PROV_KEYBOARD:  ${{ secrets.PROV_PROFILE_KEYBOARD_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROV_MAIN" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/main.mobileprovision
          echo "$PROV_KEYBOARD" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/keyboard.mobileprovision
          ls ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive（真机构建）
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DWKeyboard.xcodeproj \
            -scheme DingShiApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath /tmp/DWIME.xcarchive

      - name: 导出 ipa
        run: |
          set -o pipefail
          cat > /tmp/export.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>FT827LEPQL</string>
            <key>compileBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>DWIMECN.DingShi.App</key>
              <string>DingShiAppStore</string>
              <key>DWIMECN.DingShi.App.Keyboard</key>
              <string>DingShiKeyboardStore</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath /tmp/DWIME.xcarchive \
            -exportPath /tmp/ipa \
            -exportOptionsPlist /tmp/export.plist \
            -allowProvisioningUpdates

      - name: 上传 TestFlight（可选，需 ASC API Key）
        run: |
          if [ -z "$ASC_KEY_ID" ]; then echo "跳过上传（未配置 App Store Connect API Key）"; exit 0; fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_B64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app -f /tmp/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" \
            --type ios
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_B64:   ${{ secrets.ASC_API_KEY_BASE64 }}

      - name: 上传 ipa 到产物区（供下载）
        uses: actions/upload-artifact@v4
        with:
          name: DWIME-ipa
          path: /tmp/ipa/*.ipa
          if-no-files-found: error
