name: check-build
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: macos-15
    steps:
      - name: 查询 App Store Connect 构建状态
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          python3 -m pip install --quiet pyjwt cryptography 2>&1 | tail -2
          cat > /tmp/q.py <<'ENDS'
          import os,time,json,urllib.request,base64
          import jwt
          kid=os.environ['ASC_KEY_ID']; iss=os.environ['ASC_ISSUER_ID']
          pem=base64.b64decode(os.environ['ASC_KEY_B64']).decode('utf-8','ignore')
          now=int(time.time())
          tok=jwt.encode({'iss':iss,'iat':now-30,'exp':now+900,'aud':'appstoreconnect-v1'},pem,algorithm='ES256',headers={'kid':kid,'typ':'JWT'})
          if isinstance(tok,bytes): tok=tok.decode()
          def api(p):
              r=urllib.request.Request('https://api.appstoreconnect.apple.com'+p,headers={'Authorization':'Bearer '+tok})
              return json.load(urllib.request.urlopen(r,timeout=40))
          print('--- builds ---')
          d=api('/v1/builds?filter[app]=1123427989&limit=10&sort=-uploadedDate')
          for b in d['data']:
              a=b['attributes']
              print('version=%s build=%s state=%s expired=%s uploaded=%s' % (a.get('version'),a.get('buildNumber'),a.get('processingState'),a.get('expired'),a.get('uploadedDate')))
          print('--- preReleaseVersions ---')
          d2=api('/v1/preReleaseVersions?filter[app]=1123427989&limit=10')
          for p in d2['data']: print(p['attributes'].get('version'), p['attributes'].get('platform'))
ENDS
          python3 /tmp/q.py
